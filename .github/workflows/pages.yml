name: pages
on:
  push:
    branches: [main]
  # The wall index has to be carried forward well within the RPC's ~1 day of log history.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      seed_head:
        description: "Bootstrap only: block at or before the moment the transaction list was read"
        required: false
      seed_txs:
        description: "Bootstrap only: every transaction hash to the card contract, space separated"
        required: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        if: github.event_name != 'schedule'
      - name: Index card events
        env:
          SEED_HEAD: ${{ inputs.seed_head }}
          SEED_TXS: ${{ inputs.seed_txs }}
        run: |
          if [ -n "$SEED_HEAD" ]; then
            npm run index-wall -- --seed-head "$SEED_HEAD" --seed-txs "$SEED_TXS"
          else
            npm run index-wall
          fi
      - run: npm run build -w @apc/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
