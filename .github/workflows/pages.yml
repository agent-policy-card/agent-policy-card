name: pages
on:
  push:
    branches: [main]
  # The wall index has to be carried forward well within the RPC's log history (see README).
  # Off the top of the hour, where GitHub drops the most scheduled runs.
  schedule:
    - cron: "7-59/10 * * * *"
  workflow_dispatch:
    inputs:
      seed_head:
        description: "Bootstrap only: block at or before the moment the transaction list was read"
        required: false
      seed_txs:
        description: "Bootstrap only: every transaction hash to the card contract, space separated"
        required: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: github.event_name != 'schedule'
        run: npm run typecheck && npm test && npm run hygiene
      # Second copy of the index, so a run does not depend only on the Pages CDN.
      - uses: actions/cache/restore@v4
        with:
          path: .wall-cache
          key: wall-index-${{ github.run_id }}
          restore-keys: wall-index-
      - name: Index card events
        env:
          SEED_HEAD: ${{ inputs.seed_head }}
          SEED_TXS: ${{ inputs.seed_txs }}
        run: npx tsx scripts/index-wall.ts --cache .wall-cache/wall-index.json
      - uses: actions/cache/save@v4
        with:
          path: .wall-cache
          key: wall-index-${{ github.run_id }}
      - run: npm run build -w @apc/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
